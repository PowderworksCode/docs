name: release

# The generator reaches npm this way and no other: a tag whose name matches the
# version in package.json. What a consumer will actually run is run here first,
# and from the packed tarball rather than from the checkout -- the working tree
# carries files that `files` does not ship, so a build that passes here and
# fails for a site is exactly the mistake this step exists to catch.
#
# There is no publish token. npm trusts this workflow file in this repository,
# by name, and issues the credential to the run itself; the OIDC token below is
# the whole of the authentication. A secret that does not exist cannot leak,
# be committed, expire on a Sunday, or ask a runner for a one-time password.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  # npm provenance signs the publish with this run's OIDC token, which is what
  # lets a reader tie the tarball on the registry back to this commit.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag and the manifest agree
        id: version
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./package.json').version")"
          if [ "$tagged" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} says ${tagged}, package.json says ${manifest}"
            exit 1
          fi
          echo "version=${manifest}" >> "$GITHUB_OUTPUT"

      - name: What ships
        id: pack
        run: echo "tarball=$(npm pack --pack-destination /tmp | tail -1)" >> "$GITHUB_OUTPUT"

      # A site names itself out of powderworks.toml and sets that name in a
      # face out of fonts/, and both are in the tarball only because `files`
      # lists them. Building the example from the packed copy is what proves
      # the list is complete.
      - name: A site builds from what ships
        env:
          # npm names a scoped tarball after the scope and the name, so the
          # file is read back from pack rather than spelled out here.
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          mkdir /tmp/consumer && cd /tmp/consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund "/tmp/${TARBALL}"
          ./node_modules/.bin/powderworks-docs build \
            "${GITHUB_WORKSPACE}/example/content" --out out --site example \
            --static "${GITHUB_WORKSPACE}/example/public"
          test -s out/index.html
          grep -q 'class="burger"' out/index.html

      # Trusted publishing wants 11.5.1 or newer, and what the runner image
      # happens to ship is not a thing to release on. Latest rather than a
      # range: a range that reads ^11 would quietly step back off npm 12.
      - name: An npm that can do this
        run: npm install --global npm@latest

      # npm reports a trusted publish it cannot match as ENEEDAUTH -- "you need
      # to log in" -- which sends you looking for a missing token instead of a
      # mismatched publisher (npm/cli#9088). This prints the identity the run
      # actually presents, so the next failure can be read against the four
      # fields on the package's settings page rather than guessed at.
      - name: Who this run says it is
        run: |
          echo "workflow ref : ${GITHUB_WORKFLOW_REF}"
          echo "repository   : ${GITHUB_REPOSITORY}"
          echo "npm          : $(npm --version)"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC endpoint in this job: id-token: write is missing, so npm has nothing to authenticate with."
            exit 1
          fi
          echo "OIDC endpoint: present"

      # access is in publishConfig, so the manifest says what this publish is
      # rather than the command line saying it somewhere else. Provenance is
      # not asked for either: a trusted publish attests itself.
      - name: Publish
        run: |
          npm publish || {
            echo "::error::npm refused the publish. If that reads ENEEDAUTH, the trusted publisher on @powderworks/docs does not match this run: check organization, repository, workflow filename (release.yml, not release.yaml) and that Environment is empty, against the identity printed above."
            exit 1
          }
