# Every Powderworks site reads this file, which ships with the generator.
#
# The [org] half is what the sites have in common, and it is the reason they
# look like relatives rather than strangers: one name for the workshop, one
# face for it, one person to credit. The [site] half is what each one varies.
#
# A site names itself at build time and gets the rest from here:
#
#     powderworks-docs build content --out out --site straitjacket
#
# Repos reference each other often enough that the alternative is the same
# string written into four package.json files and wrong in one of them.
#
# published says whether a project is shown to readers, which is not the same
# question as whether its repository is public. A repository can be readable
# long before it is ready to be recommended.
#
# Pictures are in assets/<key>/ beside this file rather than in the sites, so
# the workshop's own pages can show a project's mark without cloning it. They
# are found by name, and a site keeping its own copy overwrites the shared one:
#
#     assets/<key>/logo.*   the mark, beside the site name and in the tab
#     assets/<key>/cover.*  the landing picture, which the card carries too

[org]
name = "Powderworks"
full-name = "The Powderworks Agentic Coding Consortium"
url = "https://powderworks.dev"
github = "PowderworksCode"
copyright = "Zack Maril"
newsletter = "https://newsletter.powderworks.dev/embed"

# Set wherever the workshop is named, on any of its sites.
[org.wordmark]
family = "IM Fell English SC"
words = ["The Powderworks Agentic Coding Consortium", "Powderworks"]
woff2 = "/im-fell-english-sc-latin.woff2"
ttf = "https://raw.githubusercontent.com/google/fonts/main/ofl/imfellenglishsc/IMFeENsc28P.ttf"
license = "OFL-1.1"
specimen = "https://fonts.google.com/specimen/IM+Fell+English+SC"

[site.powderworks]
published = true
name = "Powderworks"
full-name = "The Powderworks Agentic Coding Consortium"
tagline = "An agentic consortium building for the here and now."
# The card and the meta description still want a tagline; the page does not
# want it a second time under a heading that already says it.
lede = false
url = "https://powderworks.dev"
github = "PowderworksCode"
tab-title = "The Powderworks Agentic Coding Consortium"

[site.straitjacket]
published = true
name = "Straitjacket"
tagline = "Restrain your agents from shipping slop."
hero = true
cover-alt = "Engraving of a patient restrained in a strait-waistcoat"
cover-credit = """\
<a href="https://wellcomecollection.org/works/dh2xhuph">Wellcome Collection</a>, \
<a href="https://creativecommons.org/publicdomain/mark/1.0/">Public Domain Mark</a>."""
url = "https://straitjacket.dev"
github = "PowderworksCode/straitjacket"
tab-title = "Straitjacket by Powderworks"

[site.straitjacket.wordmark]
family = "Manufacturing Consent"
words = ["Straitjacket"]
woff2 = "/manufacturing-consent-latin.woff2"
ttf = "https://raw.githubusercontent.com/google/fonts/main/ofl/manufacturingconsent/ManufacturingConsent-Regular.ttf"
license = "OFL-1.1"
specimen = "https://fonts.google.com/specimen/Manufacturing+Consent"

[site.ordnung]
published = true
name = "Ordnung"
tagline = "Everything in its right place."
url = "https://ordnung.dev"
github = "PowderworksCode/ordnung"
tab-title = "Ordnung by Powderworks"

[site.ordnung.wordmark]
family = "Fredoka"
words = ["Ordnung"]
woff2 = "/fredoka-latin.woff2"
ttf = "https://raw.githubusercontent.com/google/fonts/main/ofl/fredoka/Fredoka%5Bwdth,wght%5D.ttf"
license = "OFL-1.1"
specimen = "https://fonts.google.com/specimen/Fredoka"

[site.treebank]
published = true
name = "Treebank"
tagline = "A growing collection of well-tested Tree-sitter grammars"
url = "https://treebank.dev"
github = "PowderworksCode/treebank"
tab-title = "Treebank by Powderworks"

# Fraunces italic with WONK on. The ttf is a static instance committed in the
# treebank repo rather than Google's variable file, because social-card.py
# draws with Pillow, which cannot set variation axes -- the variable file's
# default instance is opsz=9 wght=900, a 9pt Black, where the site sets a
# 144pt Semibold. Pointing at the instance keeps the card and the site in the
# same letterforms.
[site.treebank.wordmark]
family = "Fraunces"
words = ["Treebank"]
woff2 = "/fraunces-latin.woff2"
ttf = "https://raw.githubusercontent.com/PowderworksCode/treebank/main/site/public/fraunces-wonk-italic.ttf"
license = "OFL-1.1"
specimen = "https://fonts.google.com/specimen/Fraunces"
github = "PowderworksCode/treebank"

# The demonstration site, built from example/content in this repository. It is
# not a project, so it is never listed in another site's fleet; it exists to be
# looked at -- every feature the generator has, on one small tree, deployable
# to a Worker in a minute. Its pictures are drawn in the example's own public/
# directory rather than assets/example/, because a placeholder mark should not
# sit in the drawer where the real ones are kept.
[site.example]
published = false
name = "Example"
tagline = "Everything this generator does, on one small tree."
hero = true
cover-alt = "A stack of pages, each one an index of the pages below it"
cover-credit = "A placeholder, drawn in the example's own <code>public/</code>."
url = "https://example.powderworks.dev"
github = "PowderworksCode/docs"
tab-title = "Example by Powderworks"

# Not yet published: the site exists in the langbank repository and builds,
# but nothing serves langbank.dev today. Flipping this is the one-line change
# once it does.
[site.langbank]
published = false
name = "langbank"
tagline = "A sprawling collection of facts about programming languages and ecosystems."
url = "https://langbank.dev"
github = "PowderworksCode/langbank"
tab-title = "langbank by Powderworks"

# Gentium is SIL's own face — the typeface computational linguistics types in,
# for the registry the fleet names languages with.
[site.langbank.wordmark]
family = "Gentium Plus"
words = ["langbank"]
woff2 = "/gentium-plus-latin.woff2"
ttf = "https://raw.githubusercontent.com/google/fonts/main/ofl/gentiumplus/GentiumPlus-Regular.ttf"
license = "OFL-1.1"
specimen = "https://fonts.google.com/specimen/Gentium+Plus"

[site.jawohl]
published = false
name = "jawohl"
tagline = "Completes partial JSON as it streams in, token by token, from Rust, Python or JavaScript."
github = "PowderworksCode/jawohl"

[site.jedem]
published = false
name = "jedem"
tagline = "Expose a Rust function once; call it from every language, with its shape intact."
github = "PowderworksCode/jedem"

[site.infact]
published = false
name = "infact"
tagline = "Typed, provenance-carrying facts derived from observations and kept up to date incrementally."
github = "PowderworksCode/infact"
